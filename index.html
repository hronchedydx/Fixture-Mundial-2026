<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 – Fixture Completo</title>
<style>
  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2236;
    --border: #2a3550; --accent: #e8a020; --accent2: #3b82f6;
    --text: #f0f4ff; --muted: #8896b0; --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  header {
    background: linear-gradient(135deg, #0d1b3e 0%, #1a2e5a 50%, #0d1b3e 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px; position: sticky; top: 0; z-index: 100;
  }
  .header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .header-top h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.3px; }
  .header-top h1 span { color: var(--accent); }
  .badge { background: var(--accent); color: #000; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.5px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tz-btn {
    padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 0.8rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .tz-btn:hover { border-color: var(--accent2); color: var(--text); }
  .tz-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .sep { width: 1px; height: 28px; background: var(--border); }
  .filter-btn {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .search-wrap { position: relative; margin-left: auto; }
  .search-wrap input {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px 6px 32px; border-radius: 8px; font-size: 0.8rem; width: 180px;
    outline: none; transition: border-color 0.15s;
  }
  .search-wrap input:focus { border-color: var(--accent2); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; }

  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .day-group { margin-bottom: 28px; }
  .day-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .day-label { font-size: 1rem; font-weight: 700; }
  .day-count { font-size: 0.7rem; background: var(--surface2); color: var(--muted); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); }

  .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }

  .match-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; transition: border-color 0.15s, transform 0.1s;
    position: relative; overflow: hidden;
  }
  .match-card:hover { border-color: var(--accent2); transform: translateY(-1px); }
  .match-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .match-card[data-phase="Group Stage"]::before  { background: var(--accent2); }
  .match-card[data-phase="Round of 32"]::before  { background: #8b5cf6; }
  .match-card[data-phase="Round of 16"]::before  { background: #06b6d4; }
  .match-card[data-phase="Quarterfinal"]::before { background: #f59e0b; }
  .match-card[data-phase="Semifinal"]::before    { background: #f97316; }
  .match-card[data-phase="Third Place"]::before  { background: var(--green); }
  .match-card[data-phase="Final"]::before        { background: var(--accent); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .group-tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
  .gt-group { background: #1e3a5f; color: #60a5fa; }
  .gt-r32   { background: #2e1b5c; color: #a78bfa; }
  .gt-r16   { background: #0e3a44; color: #22d3ee; }
  .gt-qf    { background: #3d2a00; color: #fbbf24; }
  .gt-sf    { background: #3d1800; color: #fb923c; }
  .gt-3rd   { background: #0d3020; color: #4ade80; }
  .gt-final { background: #3d2200; color: #fbbf24; }

  .match-time { font-size: 0.95rem; font-weight: 700; color: var(--accent); text-align: right; }
  .match-time small { display: block; font-size: 0.65rem; color: var(--muted); font-weight: 400; }

  .teams { display: flex; align-items: center; gap: 6px; margin-bottom: 0; }
  .team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.86rem; font-weight: 700; text-align: center; }
  .flag { font-size: 1.6rem; line-height: 1; }
  .vs      { font-size: 0.7rem; color: var(--muted); font-weight: 600; padding: 0 4px; flex-shrink: 0; align-self: center; }
  .vs-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }

  .score-row {
    display: flex; align-items: center; gap: 6px; margin: 4px 0 8px;
  }
  .score-side { flex: 1; display: flex; justify-content: center; }
  .score-row.has-result .score-input { border-color: #1a4428; background: #0c1f12; color: var(--green); }
  .score-input {
    width: 42px; text-align: center; font-size: 1.1rem; font-weight: 800;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 2px; outline: none; transition: border-color 0.15s, color 0.15s, background 0.15s;
    -moz-appearance: textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .score-input:focus { border-color: var(--accent2); }
  .score-sep { font-size: 1.1rem; color: var(--muted); font-weight: 700; }
  .score-save {
    width: 28px; height: 28px; padding: 0; border-radius: 6px; font-size: 0.85rem;
    border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; line-height: 1;
  }
  .score-save:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .score-saved { background: #14532d !important; border-color: var(--green) !important; color: var(--green) !important; }

  .venue-row { display: flex; align-items: center; gap: 6px; }
  .venue-text { font-size: 0.73rem; color: var(--muted); }
  .venue-city { color: var(--text); font-weight: 600; }

  .phase-header {
    text-align: center; padding: 12px; margin: 24px 0 16px;
    background: var(--surface2); border-radius: 10px; border: 1px solid var(--border);
    font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9rem; }
  .empty .big { font-size: 2.5rem; margin-bottom: 8px; }

  .stats-bar { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; }
  .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
  .stat-lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  @media (max-width: 600px) {
    main { padding: 12px; }
    header { padding: 14px 12px 12px; }
    .matches-grid { grid-template-columns: 1fr; }
    .search-wrap input { width: 140px; }
  }
</style>
</head>

</header>

<main>

</main>

  try { return JSON.parse(localStorage.getItem(SCORES_KEY) || '{}'); } catch(e) { return {}; }

  const s = loadScores();
  if (h === '' && a === '') { delete s[mid]; } else { s[mid] = {h, a}; }
  localStorage.setItem(SCORES_KEY, JSON.stringify(s));
}
function mkId(date, home, away) { return date + '|' + home + '|' + away; }

// ── STATE ─────────────────────────────────────
var currentTZ = 'venue';
var currentFilter = 'all';

function setTZ(tz) {
  currentTZ = tz;
  document.querySelectorAll('.tz-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tz === tz); });
  renderAll();
}
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.filter === f); });
  renderAll();
}

// ── TIME ──────────────────────────────────────
function convertTime(etH, etM, city) {
  var utcH = etH + 4;
  var offset = (currentTZ === 'venue') ? (venueOffsets[city] || -4) : (currentTZ === 'andorra') ? andorraOffset : argentinaOffset;
  var mins = ((utcH + offset) * 60 + etM);
  mins = ((mins % 1440) + 1440) % 1440;
  var h = Math.floor(mins / 60), m = mins % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
function tzLabel() {
  if (currentTZ === 'venue') return 'hora local';
  if (currentTZ === 'andorra') return 'AND/ESP (CEST)';
  return 'Argentina (ART)';
}

// ── GROUP TAG ─────────────────────────────────
function groupTagClass(g) {
  if (g==='FINAL') return 'gt-final';
  if (g==='SF')    return 'gt-sf';
  if (g==='QF')    return 'gt-qf';
  if (g==='R16')   return 'gt-r16';
  if (g==='R32')   return 'gt-r32';
  if (g==='3P')    return 'gt-3rd';
  return 'gt-group';
}
function groupLabel(g) {
  var map = {R32:'Octavos (32)',R16:'Octavos (16)',QF:'Cuartos',SF:'Semifinal','3P':'3er Puesto',FINAL:'🏆 FINAL'};
  return map[g] || ('Grupo ' + g);
}

// ── FILTER ────────────────────────────────────
function getFiltered() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  return matches.filter(function(m) {
    var phase = m[8];
    if (currentFilter === 'Group Stage' && phase !== 'Group Stage') return false;
    if (currentFilter === 'knockout'    && phase === 'Group Stage')  return false;
    if (q && m[3].toLowerCase().indexOf(q) === -1 && m[4].toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

// ── RENDER ────────────────────────────────────
function renderAll() {
  var filtered = getFiltered();
  var scores = loadScores();

  // Stats bar — only show relevant counters
  var gsCount = filtered.filter(function(m){ return m[8]==='Group Stage'; }).length;
  var koCount = filtered.filter(function(m){ return m[8]!=='Group Stage'; }).length;
  var venueCount = (function(){
    var seen = {}; filtered.forEach(function(m){ seen[m[6]]=1; }); return Object.keys(seen).length;
  })();
  var statsHtml = '<div class="stat"><div class="stat-val">' + filtered.length + '</div><div class="stat-lbl">Partidos</div></div>';
  if (gsCount > 0) statsHtml += '<div class="stat"><div class="stat-val">' + gsCount + '</div><div class="stat-lbl">Fase Grupos</div></div>';
  if (koCount > 0) statsHtml += '<div class="stat"><div class="stat-val">' + koCount + '</div><div class="stat-lbl">Eliminatoria</div></div>';
  statsHtml += '<div class="stat"><div class="stat-val">' + venueCount + '</div><div class="stat-lbl">Sedes</div></div>';
  document.getElementById('statsBar').innerHTML = statsHtml;

  var content = document.getElementById('content');
  if (!filtered.length) {
    content.innerHTML = '<div class="empty"><div class="big">🔍</div>No se encontraron partidos.</div>';
    return;
  }

  // Group by date
  var byDate = {};
  filtered.forEach(function(m) {
    if (!byDate[m[0]]) byDate[m[0]] = [];
    byDate[m[0]].push(m);
  });

  var phaseNames = {
    'Round of 32':'⚔️ Octavos de Final – Ronda de 32',
    'Round of 16':'⚔️ Octavos de Final – Ronda de 16',
    'Quarterfinal':'🏟️ Cuartos de Final',
    'Semifinal':'🔥 Semifinales',
    'Third Place':'🥉 Tercer Puesto',
    'Final':'🏆 Gran Final'
  };

  var lastPhase = '';
  var html = '';

  Object.keys(byDate).sort().forEach(function(date) {
    var dayMatches = byDate[date];
    var d = new Date(date + 'T12:00:00Z');
    var dayName = d.toLocaleDateString('es-ES', {weekday:'long', month:'long', day:'numeric', timeZone:'UTC'});
    var cap = function(s){ return s.charAt(0).toUpperCase() + s.slice(1); };

    var phase = dayMatches[0][8];
    if (phase !== 'Group Stage' && phase !== lastPhase) {
      html += '<div class="phase-header">' + (phaseNames[phase] || phase) + '</div>';
      lastPhase = phase;
    }

    html += '<div class="day-group"><div class="day-header"><span class="day-label">' + cap(dayName) + '</span><span class="day-count">' + dayMatches.length + ' partido' + (dayMatches.length>1?'s':'') + '</span></div><div class="matches-grid">';

    dayMatches.forEach(function(m) {
      var dateStr=m[0], etH=m[1], etM=m[2], home=m[3], away=m[4], venue=m[5], city=m[6], group=m[7], phase=m[8];
      var time = convertTime(etH, etM, city);
      var fHome = getFlag(home);
      var fAway = getFlag(away);
      var mid = mkId(dateStr, home, away);
      var sc = scores[mid];
      var hasResult = sc && sc.h !== '' && sc.a !== '';
      // Escape single quotes in mid for inline onclick
      var midEsc = mid.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

      html += '<div class="match-card" data-phase="' + phase + '">';
      html += '<div class="card-top"><span class="group-tag ' + groupTagClass(group) + '">' + groupLabel(group) + '</span><div class="match-time">' + time + '<small>' + tzLabel() + '</small></div></div>';
      html += '<div class="teams">';
      html += '<span class="team">' + (fHome ? '<span class="flag">' + fHome + '</span>' : '') + '<span>' + home + '</span></span>';
      html += '<div class="vs-wrap"><span class="vs">vs</span><span class="score-sep">:</span></div>';
      html += '<span class="team">' + (fAway ? '<span class="flag">' + fAway + '</span>' : '') + '<span>' + away + '</span></span>';
      html += '</div>';
      html += '<div class="score-row' + (hasResult ? ' has-result' : '') + '">';
      html += '<div class="score-side"><input class="score-input score-h" type="number" min="0" max="99" placeholder="-" value="' + (sc ? sc.h : '') + '"></div>';
      html += '<button class="score-save" title="Guardar resultado" onclick="handleSave(this,\'' + midEsc + '\')">💾</button>';
      html += '<div class="score-side"><input class="score-input score-a" type="number" min="0" max="99" placeholder="-" value="' + (sc ? sc.a : '') + '"></div>';
      html += '</div>';
      html += '<div class="venue-row"><span style="font-size:.75rem">📍</span><span class="venue-text"><span class="venue-city">' + city + '</span> · ' + venue + '</span></div>';
      html += '</div>';
    });

    html += '</div></div>';
  });

  content.innerHTML = html;
}

renderAll();
</script>
